name: Quality Check

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get Flutter version from .fvmrc
        id: fvm-version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-version.outputs.version }}
          cache: true

      - name: Install tool/ dependencies
        working-directory: tool
        run: dart pub get

      - name: Run tool/ unit tests
        working-directory: tool
        run: dart test

      - name: Regenerate icons from pinned upstream commit
        working-directory: tool
        run: dart run generate_icons.dart

      - name: Check regenerated output matches committed output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: generated output is out of date. Run 'cd tool && dart run generate_icons.dart' locally and commit the changes."
            git status
            exit 1
          fi

      - name: Install package dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
