name: aura_icons_tool
description: "Codegen tool for aura_icons: pulls upstream SVG source, normalizes, compiles vector assets, and generates Dart bindings. Dev-only, never a dependency of aura_icons itself."
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.0.9
  path: ^1.9.1
  yaml: ^3.1.3
  collection: ^1.19.1
  vector_graphics_compiler: ^1.3.0

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
